name: Update Credly Badges
on:
  schedule:
    - cron: "0 2 * * *" # Automatically updates daily at 2:00 AM UTC
  workflow_dispatch: # Allows you to manually trigger it anytime

permissions:
  contents: write

jobs:
  update-badges:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update Readme with Credly Badges
        uses: pemtajo/badge-readme@main
        with:
          CREDLY_USER: "miconvr" # <--- If this matches your Credly username URL, leave it!
          NUMBER_LAST_BADGES: 10
