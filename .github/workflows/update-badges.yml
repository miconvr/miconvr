name: Update Credly Badges
on:
  schedule:
    - cron: "0 2 * * *" # Updates automatically every day at 2:00 AM UTC
  workflow_dispatch: # Allows you to manually trigger it

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- STEP 1: AUTOMATE YOUR CLAUDE ACADEMY BADGE (Blends into Grid) ---
      - name: Inject Claude Academy Badge
        shell: python
        run: |
          import re

          # Paste your unique verification link between the quotes from your Academy dashboard!
          claude_verify_url = "YOUR_CLAUDE_ACADEMY_COPY_LINK_HERE"
          
          # Production asset URL for the AI Fluency badge icon
          claude_badge_img = "https://claude.com"

          # Formatted identically to match the layout grid generated by your Credly workflow
          badge_html = f'<a href="{claude_verify_url}" target="_blank"><img src="{claude_badge_img}" width="110" height="110" alt="Claude Academy - AI Fluency: Framework and foundations" /></a>'

          with open("README.md", "r", encoding="utf-8") as file:
              readme_content = file.read()

          pattern = r"(<!-- START CLAUDE BADGES -->)(.*?)(<!-- END CLAUDE BADGES -->)"
          replacement = f"\\1\\n{badge_html}\\n\\3"
          updated_content = re.sub(pattern, replacement, readme_content, flags=re.DOTALL)

          with open("README.md", "w", encoding="utf-8") as file:
              file.write(updated_content)

      # --- STEP 2: YOUR EXISTING SETUP FOR CREDLY ---
      - name: Update Credly Badges
        uses: jd-35656/readme-credly-badges@v1
        with:
          credly_username: "miconvr"
          badge_size: "110x110"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # --- STEP 3: COMMIT ALL UPDATES ---
      - name: Commit and Push Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add README.md
          git diff-index --quiet HEAD || git commit -m "chore: auto-update portfolio badges" && git push
