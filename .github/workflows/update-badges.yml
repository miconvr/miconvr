name: Update Credly Badges
on:
  schedule:
    - cron: "0 2 * * *" # Runs automatically every day at 2:00 AM UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-badges:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and update Credly Badges
        uses: inverse/credly-badge-pr@v1
        with:
          credly_user: "miconvr"
