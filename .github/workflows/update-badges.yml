name: Update Certifications Grid
on:
  schedule:
    - cron: "0 2 * * *" # Runs automatically every day at 2:00 AM UTC
  workflow_dispatch: # Allows you to manually trigger it

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Credly and Merge Claude Badges
        shell: python
        run: |
          import urllib.request
          import json
          import re

          # 1. Configuration
          credly_username = "miconvr"
          badge_size = "110"
          claude_verify_url = "https://claude.com"
          claude_badge_img = "https://shields.io"

          # 2. Define the static Claude Badge HTML element
          # Sized at 165x40 to look sharp as a leading badge row anchor
          claude_html = f'<a href="{claude_verify_url}" target="_blank"><img src="{claude_badge_img}" height="40" alt="Claude Academy - AI Fluency" /></a>'

          # 3. Fetch public badges from Credly API
          credly_html_list = []
          try:
              url = f"https://credly.com{credly_username}/badges"
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req) as response:
                  data = json.loads(response.read().decode())
                  
                  # Extract and loop through your active credentials
                  for badge in data.get('data', []):
                      b_url = badge.get('user_badge_url')
                      b_img = badge.get('badge_template', {}).get('image_url')
                      b_title = badge.get('badge_template', {}).get('name')
                      
                      if b_url and b_img:
                          html_item = f'<a href="{b_url}" target="_blank"><img src="{b_img}" width="{badge_size}" height="{badge_size}" alt="{b_title}" title="{b_title}" /></a>'
                          credly_html_list.append(html_item)
          except Exception as e:
              print(f"Warning: Could not fetch Credly data: {e}")

          # 4. Construct the unified outputs
          claude_output = f"<!-- START CLAUDE BADGES -->\n{claude_html}\n<!-- END CLAUDE BADGES -->"
          credly_output = f"<!-- START CREDLY BADGES -->\n{' '.join(credly_html_list)}\n<!-- END CREDLY BADGES -->"

          # 5. Read and update the README file
          with open("README.md", "r", encoding="utf-8") as file:
              readme = file.read()

          # Replace sections cleanly using regex
          readme = re.sub(r"<!-- START CLAUDE BADGES -->.*?<!-- END CLAUDE BADGES -->", claude_output, readme, flags=re.DOTALL)
          readme = re.sub(r"<!-- START CREDLY BADGES -->.*?<!-- END CREDLY BADGES -->", credly_output, readme, flags=re.DOTALL)

          with open("README.md", "w", encoding="utf-8") as file:
              file.write(readme)

      - name: Commit and Push Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: automated sync of portfolio credentials"
            git push
          else
            echo "Everything is already up to date."
          fi
