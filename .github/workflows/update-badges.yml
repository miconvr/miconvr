name: Update Credly Badges
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- STEP 1: AUTOMATE YOUR CLAUDE ACADEMY BADGE ---
      - name: Inject Claude Academy Badge
        shell: python
        run: |
          import re
          import os

          claude_verify_url = "https://claude.com"
          claude_badge_img = "https://claude.com"
          badge_html = f'<a href="{claude_verify_url}" target="_blank"><img src="{claude_badge_img}" width="110" height="110" alt="Claude Academy - AI Fluency: Framework and foundations" /></a>'

          # Create README.md if it doesn't exist
          if not os.path.exists("README.md"):
              with open("README.md", "w", encoding="utf-8") as file:
                  file.write("<!-- START CLAUDE BADGES --><!-- END CLAUDE BADGES -->\n<!-- START CREDLY BADGES --><!-- END CREDLY BADGES -->")

          with open("README.md", "r", encoding="utf-8") as file:
              readme_content = file.read()

          # If markers are missing, prepend them safely to the top
          if "<!-- START CLAUDE BADGES -->" not in readme_content:
              readme_content = "<!-- START CLAUDE BADGES --><!-- END CLAUDE BADGES -->\n" + readme_content

          pattern = r"(<!-- START CLAUDE BADGES -->)(.*?)(<!-- END CLAUDE BADGES -->)"
          replacement = f"\\1\\n{badge_html}\\n\\3"
          updated_content = re.sub(pattern, replacement, readme_content, flags=re.DOTALL)

          with open("README.md", "w", encoding="utf-8") as file:
              file.write(updated_content)

      # --- STEP 2: YOUR EXISTING SETUP FOR CREDLY ---
      - name: Update Credly Badges
        uses: jd-35656/readme-credly-badges@v1
        with:
          credly_username: "miconvr"
          badge_size: "110x110"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # --- STEP 3: SAFELY COMMIT AND PUSH ---
      - name: Commit and Push Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add README.md
          # Safe conditional commit that won't exit with error 1 if there's nothing new
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-update portfolio badges"
            git push
          else
            echo "No changes detected. Skipping commit."
          fi
