
name: Update Certifications Grid

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update Credly Badges
        uses: kpab/credly-readme@v1
        with:
          credly_user: miconvr
          sort: LATEST
          badge_width: 110
